replicaCount: 1
common:
  &common
  command: []
  args: []
  image:
    repository: repository.chainbase.com/network/chainbase-node
  initContainer:
    image:
      repository: ghcr.io/foundry-rs/foundry
      pullPolicy: IfNotPresent
      tag: "latest"
    command:
      - /bin/sh
    args:
      - date
  volumeMounts:
    - name: ecdsa-key
      mountPath: /operator_keys/ecdsa_key.json
      subPath: ecdsa_key.json
      readOnly: true
    - name: bls-key
      mountPath: /operator_keys/bls_key.json
      subPath: bls_key.json
      readOnly: true
    - name: config
      mountPath: /app/node.yaml
      subPath: node.yaml
  env:
    - name: OPERATOR_BLS_KEY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: chainbase-bls-key
          key: bls-private-key-password
    - name: OPERATOR_ECDSA_KEY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: your-secrets
          key: ecdsa-private-key-password
    - name: NODE_ECDSA_KEY_FILE_PATH
      value: /operator_keys/ecdsa_key.json
    - name: NODE_BLS_KEY_FILE_PATH
      value: /operator_keys/bls_key.json
    # - name: OPERATOR_ECDSA_KEY_PASSWORD
    #   value: yourECDSAKeyPassword
    # - name: OPERATOR_BLS_KEY_PASSWORD
    #   value: yourBlsKeyPassword
    - name: OPERATOR_ADDRESS
      value: yourECDSAKeyAddress
    # Ip address and port of the Node gRPC server.Like 8.219.81.93:8011
    # Ensure your server’s public IP is internet-accessible.
    # Verify that port 8011 is open and properly configured in your firewall settings.
    - name: NODE_SOCKET
      value: yourNodeSocket
    - name: OPERATOR_NAME
      value: yourOperatorName

node:
  <<: *common

jobmanager:
  <<: *common
  image:
    repository: repository.chainbase.com/network/ms_flink
    tag: v1.2-test
  command: ["/bin/sh", "-c"]
  args:
    - ./bin/jobmanager.sh start-foreground

taskmanager:
  <<: *common
  image:
    repository: repository.chainbase.com/network/ms_flink
    tag: v1.2-test
  command: ["/bin/sh", "-c"]
  args:
    - ./bin/taskmanager.sh start-foreground

shell:
  <<: *common
  image:
    repository: repository.chainbase.com/network/chainbase-cli
  command: ["/bin/sh", "-c"]
  args:
    - while true; do sleep 10000; done

register:
  <<: *common
  image:
    repository: repository.chainbase.com/network/chainbase-cli
  enabled: false
  args:
  - --config /app/node.yaml
  - "register-operator-with-avs"

ingress:
  annotations: {}
  enabled: false
  host: chainbase-holesky.el.test.world

serviceAccount:
  create: false
  name: chainbase


service:
  annotations: {}
  type: LoadBalancer
  ports:
    - name: node-socket
      port: 8011
      protocol: TCP
      targetPort: 8011

volumes:
  - name: ecdsa-key
    secret:
      secretName: operator-key
      items:
        - key: ecdsa-private-key
          path: ecdsa_key.json
  - name: bls-key
    secret:
      secretName: chainbase-bls-key
      items:
        - key: bls-private-key
          path: bls-key.json
  - name: emptydir
    emptyDir: {}

postgresql:
  auth:
    enablePostgresUser: true
    postgresPassword: "superPuperSecrets"
    username: "chainbase"
    password: "superPuperSecretsChainbase"
    database: "manuscript_node"

configs:
  node.yaml: |

    # this sets the logger level (true = info, false = debug)
    production: false
    # avs contract
    avs_registry_coordinator_address: 0x28c486660aFF4C3ffC671cb72Ff36FeA214e8dE1
    operator_state_retriever_address: 0x95376d028Cad10259E30d6565D460E01aB652EB9
    # ETH RPC URL
    eth_rpc_url: https://ethereum-rpc.publicnode.com
    eth_ws_url: wss://ethereum-rpc.publicnode.com

    ecdsa_private_key_store_path: /operator_keys/ecdsa_key.json
    bls_private_key_store_path: /operator_keys/bls_key.json

    # address which the coordinator listens on for manuscript node signed messages
    coordinator_server_ip_port_address: 8.219.3.174:8090
    # node groc server address
    node_grpc_server_address: :8011

    # avs node spec compliance https://eigen.nethermind.io/docs/spec/intro
    eigen_metrics_ip_port_address: :9090
    enable_metrics: true
    node_api_ip_port_address: :9010
    enable_node_api: true

    # postgres container
    postgres_host: postgres
    postgres_port: 5432
    postgres_user: chainbase
    postgres_password: superPuperSecretsChainbase
    postgres_database: manuscript_node

    # job manager container
    job_manager_host: chainbase_jobmanager
    job_manager_port: 8081

vmPodScrape:
  enabled: false
